<!DOCTYPE html
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دُعاة | دليل الدعاة والعلماء المسلمين ومقارني الأديان</title>
  <meta name="description" content="اكتشف دليل الدعاة والعلماء المسلمين، وتعرّف على سيرتهم وتخصصاتهم ومحاضراتهم وروابط حساباتهم الرسمية في منصة دُعاة.">
  
  <!-- Google Search Console Verification (Encrypted) -->
  <script>
    (function(){
      const enc = "dkprRkJyZ2RBUGwzLXVDWTZXWFQ1YThYOE10V3M3bTJtbEU=";
      const meta = document.createElement('meta');
      meta.name = "google-site-verification";
      meta.content = atob(enc);
      document.head.appendChild(meta);
    })();
  </script>

  <link rel="icon" type="image/jpeg" href="fac.logo.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandDark: '#0D2B45',
            brandGold: '#C49A4A',
            brandGray: '#70767D',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg-primary: #f0f4f8;
      --bg-glass: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(196, 154, 74, 0.3);
      --text-main: #0D2B45;
      --card-shadow: 0 10px 30px 0 rgba(13, 43, 69, 0.1);
    }
    .dark {
      --bg-primary: #050d14;
      --bg-glass: rgba(13, 43, 69, 0.55);
      --glass-border: rgba(196, 154, 74, 0.25);
      --text-main: #f4f6f8;
      --card-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.6);
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      transition: background-color 0.5s ease, color 0.5s ease;
    }
    .futuristic-glass {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--card-shadow);
    }
    .neon-glow:hover {
      box-shadow: 0 0 20px rgba(196, 154, 74, 0.4);
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brandGold selection:text-white">

  <!-- Navbar -->
  <header class="sticky top-0 z-50 futuristic-glass mx-4 sm:mx-8 my-4 px-6 py-4 rounded-2xl flex items-center justify-between transition-all duration-300">
    <div class="flex items-center gap-3">
      <img src="logo.WebP" alt="دُعاة" class="h-11 w-11 rounded-xl object-cover border border-brandGold/40 shadow-md" />
      <span class="text-2xl font-black tracking-wider text-brandGold drop-shadow-sm">دُعاة</span>
    </div>

    <div class="flex items-center gap-3">
      <button id="openModalBtn" class="bg-gradient-to-r from-brandGold to-amber-600 hover:from-amber-600 hover:to-brandGold text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 shadow-lg transition-all transform hover:scale-105 active:scale-95">
        <i data-lucide="user-plus" class="w-5 h-5"></i>
        <span class="hidden sm:inline">إضافة شخصية</span>
      </button>

      <button id="themeToggle" class="p-2.5 rounded-xl futuristic-glass text-brandGold hover:bg-brandGold/10 transition-all">
        <i id="themeIcon" data-lucide="sun" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="text-center py-16 px-4 max-w-4xl mx-auto relative">
    <div class="absolute inset-0 -z-10 bg-brandGold/5 blur-3xl rounded-full"></div>
    <h1 class="text-4xl sm:text-6xl font-black text-brandGold mb-6 tracking-tight leading-tight">دليل الدعاة والعلماء</h1>
    <p class="text-lg sm:text-xl text-[#70767D] dark:text-gray-300 font-medium max-w-2xl mx-auto leading-relaxed">
      منصة رقمية متقدمة للتعرف على سير وتخصصات أفضل الدعاة ورجال الدين ومقارني الأديان وروابط حساباتهم الرسمية.
    </p>
  </section>

  <!-- Main Grid Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-grow w-full">
    <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
      <!-- يتم تحميل البطاقات ديناميكياً هنا -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="futuristic-glass mt-16 py-6 text-center text-sm text-[#70767D]">
    <p>جميع الحقوق محفوظة © منصة دُعاة 2026</p>
  </footer>

  <!-- Add Person Modal -->
  <div id="addModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 transition-all">
    <div class="futuristic-glass max-w-lg w-full p-6 sm:p-8 rounded-3xl relative text-right max-h-[90vh] overflow-y-auto border border-brandGold/30">
      <button id="closeModalBtn" class="absolute top-5 left-5 text-gray-400 hover:text-brandGold transition-colors">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
      
      <h2 class="text-2xl font-extrabold text-brandGold mb-6 flex items-center gap-2">
        <i data-lucide="sparkles" class="w-6 h-6"></i> إضافة شخصية جديدة
      </h2>
      
      <form id="addPersonForm" class="space-y-4">
        <div>
          <label class="block mb-2 text-sm font-bold">اسم الشخصية ولقبها *</label>
          <input type="text" id="personName" required placeholder="مثال: فضيلة الشيخ..." class="w-full p-3 rounded-xl futuristic-glass border border-brandGold/30 focus:outline-none focus:border-brandGold transition-all">
        </div>

        <div>
          <label class="block mb-2 text-sm font-bold">طريقة إضافة الصورة</label>
          <select id="imageTypeSelect" class="w-full p-3 rounded-xl futuristic-glass border border-brandGold/30 focus:outline-none focus:border-brandGold transition-all">
            <option value="file" class="bg-brandDark text-white">رفع صورة من الجهاز (تلقائي)</option>
            <option value="url" class="bg-brandDark text-white">رابط صورة خارجي (URL)</option>
          </select>
        </div>

        <div id="fileUploadContainer">
          <label class="block mb-2 text-sm font-bold">اختر صورة الشخصية</label>
          <input type="file" id="personFile" accept="image/*" class="w-full p-2.5 rounded-xl futuristic-glass border border-brandGold/30 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-brandGold file:text-white file:font-semibold">
        </div>

        <div id="urlUploadContainer" class="hidden">
          <label class="block mb-2 text-sm font-bold">رابط الصورة (URL)</label>
          <input type="url" id="personUrl" placeholder="https://..." class="w-full p-3 rounded-xl futuristic-glass border border-brandGold/30 focus:outline-none focus:border-brandGold transition-all">
        </div>

        <!-- Social Media Inputs -->
        <div class="space-y-3 pt-3 border-t border-brandGold/20">
          <label class="block text-sm font-bold text-brandGold">روابط التواصل الاجتماعي المتاحة (اختياري)</label>
          
          <div class="flex items-center gap-3">
            <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="فيسبوك" class="w-6 h-6 object-contain" />
            <input type="url" id="facebookUrl" placeholder="رابط صفحة فيسبوك" class="w-full p-2.5 rounded-xl futuristic-glass border border-brandGold/30 text-sm focus:border-brandGold">
          </div>

          <div class="flex items-center gap-3">
            <img src="https://cdn-icons-png.flaticon.com/512/15707/15707749.png" alt="انستجرام" class="w-6 h-6 object-contain" />
            <input type="url" id="instagramUrl" placeholder="رابط حساب انستجرام" class="w-full p-2.5 rounded-xl futuristic-glass border border-brandGold/30 text-sm focus:border-brandGold">
          </div>

          <div class="flex items-center gap-3">
            <img src="https://cdn-icons-png.flaticon.com/512/174/174883.png" alt="يوتيوب" class="w-6 h-6 object-contain" />
            <input type="url" id="youtubeUrl" placeholder="رابط قناة يوتيوب" class="w-full p-2.5 rounded-xl futuristic-glass border border-brandGold/30 text-sm focus:border-brandGold">
          </div>

          <!-- TikTok Input -->
          <div class="flex items-center gap-3">
            <img src="https://cdn-icons-png.flaticon.com/512/4782/4782345.png" alt="تيك توك" class="w-6 h-6 object-contain" />
            <input type="url" id="tiktokUrl" placeholder="رابط حساب تيك توك" class="w-full p-2.5 rounded-xl futuristic-glass border border-brandGold/30 text-sm focus:border-brandGold">
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-brandGold to-amber-600 text-white font-bold text-lg shadow-xl hover:opacity-95 transition-all mt-4">
          إرسال للمراجعة
        </button>
      </form>
    </div>
  </div>

  <!-- Script logic connecting to Firebase & rendering social links + verification badge under cards -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCo3Fw_Qm5MD9ouJ02PoGcKAaZcxGUK2E",
      authDomain: "muslim-3483a.firebaseapp.com",
      projectId: "muslim-3483a",
      storageBucket: "muslim-3483a.firebasestorage.app",
      messagingSenderId: "543628140761",
      appId: "1:543628140761:web:15a6b1692b99aa94215ec8",
      measurementId: "G-0CEJWQLHD0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Theme Switcher
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    themeToggle.onclick = () => {
      const html = document.documentElement;
      html.classList.toggle('dark');
      themeIcon.setAttribute('data-lucide', html.classList.contains('dark') ? 'sun' : 'moon');
      lucide.createIcons();
    };

    // Modal Controls
    const modal = document.getElementById('addModal');
    document.getElementById('openModalBtn').onclick = () => modal.classList.remove('hidden');
    document.getElementById('closeModalBtn').onclick = () => modal.classList.add('hidden');

    document.getElementById('imageTypeSelect').onchange = (e) => {
      if(e.target.value === 'file') {
        document.getElementById('fileUploadContainer').classList.remove('hidden');
        document.getElementById('urlUploadContainer').classList.add('hidden');
      } else {
        document.getElementById('fileUploadContainer').classList.add('hidden');
        document.getElementById('urlUploadContainer').classList.remove('hidden');
      }
    };

    // Image Compressor to Base64
    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 500;
            const scale = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
          };
        };
      });
    }

    // Submit Handler
    document.getElementById('addPersonForm').onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('personName').value;
      const type = document.getElementById('imageTypeSelect').value;
      let image = '';

      if (type === 'file') {
        const file = document.getElementById('personFile').files[0];
        if (file) image = await compressImage(file);
      } else {
        image = document.getElementById('personUrl').value.trim();
      }

      const socials = {
        facebook: document.getElementById('facebookUrl').value.trim(),
        instagram: document.getElementById('instagramUrl').value.trim(),
        youtube: document.getElementById('youtubeUrl').value.trim(),
        tiktok: document.getElementById('tiktokUrl').value.trim()
      };

      await push(ref(db, 'persons'), { name, image, socials, status: 'pending' });
      alert("شكراً لك! سيتم مراجعة بيانات الشخصية ورفعها في أقرب وقت في ميزان حسناتك.");
      modal.classList.add('hidden');
      e.target.reset();
    };

    // Render Approved Cards with Verification Badge & Custom Social Icons
    onValue(ref(db, 'persons'), (snapshot) => {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      
      snapshot.forEach((child) => {
        const data = child.val();
        if (data.status === 'approved') {
          // بناء أزرار السوشيال ميديا بالصور المخصصة
          let socialLinksHTML = '';
          if (data.socials) {
            if (data.socials.facebook) {
              socialLinksHTML += `
                <a href="${data.socials.facebook}" target="_blank" class="p-2 rounded-xl bg-white/5 hover:bg-white/20 transition-all shadow-sm transform hover:scale-110">
                  <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="فيسبوك" class="w-5 h-5 object-contain" />
                </a>`;
            }
            if (data.socials.instagram) {
              socialLinksHTML += `
                <a href="${data.socials.instagram}" target="_blank" class="p-2 rounded-xl bg-white/5 hover:bg-white/20 transition-all shadow-sm transform hover:scale-110">
                  <img src="https://cdn-icons-png.flaticon.com/512/15707/15707749.png" alt="انستجرام" class="w-5 h-5 object-contain" />
                </a>`;
            }
            if (data.socials.youtube) {
              socialLinksHTML += `
                <a href="${data.socials.youtube}" target="_blank" class="p-2 rounded-xl bg-white/5 hover:bg-white/20 transition-all shadow-sm transform hover:scale-110">
                  <img src="https://cdn-icons-png.flaticon.com/512/174/174883.png" alt="يوتيوب" class="w-5 h-5 object-contain" />
                </a>`;
            }
            if (data.socials.tiktok) {
              socialLinksHTML += `
                <a href="${data.socials.tiktok}" target="_blank" class="p-2 rounded-xl bg-white/5 hover:bg-white/20 transition-all shadow-sm transform hover:scale-110">
                  <img src="https://cdn-icons-png.flaticon.com/512/4782/4782345.png" alt="تيك توك" class="w-5 h-5 object-contain" />
                </a>`;
            }
          }

          // صورة افتراضية في حال وجود مشكلة في رابط الصورة الخارجي
          const displayImage = data.image && data.image !== '' ? data.image : 'logo.WebP';

          grid.innerHTML += `
            <div class="futuristic-glass rounded-3xl p-5 flex flex-col items-center gap-4 neon-glow transition-all duration-300">
              <div class="w-full h-64 rounded-2xl overflow-hidden relative shadow-inner bg-black/20">
                <img src="${displayImage}" 
                     onerror="this.onerror=null; this.src='logo.WebP';" 
                     alt="${data.name}" 
                     class="w-full h-full object-cover transform hover:scale-105 transition-transform duration-500">
              </div>
              
              <div class="w-full text-center space-y-3">
                <!-- الاسم وبجانبه علامة التوثيق -->
                <div class="flex items-center justify-center gap-2">
                  <h3 class="text-xl font-black text-brandGold tracking-wide">${data.name}</h3>
                  <img src="https://cdn-icons-png.flaticon.com/128/4823/4823340.png" alt="توثيق" class="w-5 h-5 object-contain inline-block" title="شخصية موثوقة" />
                </div>
                
                <!-- روابط التواصل المتاحة -->
                <div class="flex items-center justify-center gap-3 pt-2 border-t border-brandGold/20 min-h-[45px]">
                  ${socialLinksHTML !== '' ? socialLinksHTML : '<span class="text-xs text-gray-400 italic">لا توجد حسابات مضافة</span>'}
                </div>
              </div>
            </div>
          `;
        }
      });
      lucide.createIcons();
    });
  </script>
</body>
</html>
