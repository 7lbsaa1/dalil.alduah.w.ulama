<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم | دُعاة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="p-6 min-h-screen">

  <!-- Admin Login View -->
  <div id="loginView" class="max-w-md mx-auto my-20 glass-card p-8 text-right">
    <h1 class="text-2xl font-bold text-[#C49A4A] mb-6 text-center">تسجيل دخول الأدمن</h1>
    <form id="adminLoginForm" class="space-y-4">
      <div>
        <label class="block mb-1">البريد الإلكتروني</label>
        <input type="email" id="adminEmail" required class="w-full p-2.5 rounded bg-white/10 border border-gray-500">
      </div>
      <div>
        <label class="block mb-1">كلمة المرور</label>
        <input type="password" id="adminPassword" required class="w-full p-2.5 rounded bg-white/10 border border-gray-500">
      </div>
      <button type="submit" class="w-full btn-gold py-2.5 rounded font-bold">تسجيل الدخول</button>
    </form>
  </div>

  <!-- Admin Dashboard View -->
  <div id="dashboardView" class="hidden max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-8 glass-card p-4">
      <h1 class="text-2xl font-bold text-[#C49A4A]">لوحة إدارة منصة دُعاة</h1>
      <button id="logoutBtn" class="bg-red-600 text-white px-4 py-2 rounded">تسجيل الخروج</button>
    </div>

    <!-- Pending Cards Section -->
    <section class="mb-12">
      <h2 class="text-xl font-bold mb-4 text-yellow-400 flex items-center gap-2">
        <i data-lucide="clock"></i> طلبات الشخصيات قيد المراجعة
      </h2>
      <div id="pendingContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </section>

    <!-- Published Cards Section -->
    <section>
      <h2 class="text-xl font-bold mb-4 text-green-400 flex items-center gap-2">
        <i data-lucide="check-circle"></i> الشخصيات المتاحة في الصفحة الرئيسية
      </h2>
      <div id="publishedContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </section>
  </div>

  <script src="admin.js" type="module"></script>
</body>
</html>
